# Explicit project name. Compose otherwise derives it from the directory, and two projects in
# this portfolio share the directory name 02-nft-marketplace, so without this they would share
# one namespace and tear each other down.
name: bscfarm

services:
  postgres:
    image: postgres:17-alpine
    container_name: bscfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bscfarm
      POSTGRES_PASSWORD: bscfarm
      POSTGRES_DB: bscfarm
    # Port 5434 so this runs alongside the Ethereum projects' databases.
    ports:
      - "5434:5432"
    volumes:
      - bscfarm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscfarm -d bscfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    # A bare local chain. `script/Demo.s.sol` deploys stand-ins for the PancakeSwap router, the LP
    # pair and the Chainlink feed on top of it, so the whole stack runs offline.
    #
    # To exercise the real integrations instead, fork BSC:
    #
    #   BSC_FORK_URL=<archive endpoint> docker compose up -d
    #   # then add to the command below:
    #   #   --fork-url=${BSC_FORK_URL}
    #
    # Note that this needs an *archive* endpoint. The public dataseed nodes prune state within a
    # couple of hundred blocks, so a fork against them fails with "missing trie node" as soon as the
    # chain head moves past your fork block. test/ForkPancake.t.sol has the same requirement.
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: bscfarm-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--chain-id=31337"
      - "--mnemonic=test test test test test test test test test test test junk"
      # Three seconds, matching BNB Smart Chain, so the indexer's confirmation window behaves the
      # way it would in production.
      - "--block-time=3"
    ports:
      - "8547:8545"

volumes:
  bscfarm-data:
